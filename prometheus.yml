scrape_configs:
  - job_name: 'personalization-service'
    static_configs:
      - targets: ['personalization-server:8082']
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['authorization-server:8083']
  - job_name: 'core-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['core-server:8080']