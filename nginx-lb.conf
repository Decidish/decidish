events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Connection keepalive to backends
    keepalive_timeout 65;
    
    # Load balancing across 3 authorization server instances
    upstream auth-service {
        least_conn;
        server authorization-server-1:8083 max_fails=3 fail_timeout=30s;
        server authorization-server-2:8083 max_fails=3 fail_timeout=30s;
        server authorization-server-3:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Load balancing across 3 core server instances
    upstream shopping-service {
        least_conn;
        server core-server-1:8080 max_fails=3 fail_timeout=30s;
        server core-server-2:8080 max_fails=3 fail_timeout=30s;
        server core-server-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Load balancing across 3 personalization server instances
    upstream personalization-service {
        least_conn;
        server personalization-server-1:8082 max_fails=3 fail_timeout=30s;
        server personalization-server-2:8082 max_fails=3 fail_timeout=30s;
        server personalization-server-3:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;

        # Shared Proxy Settings (applied to all locations below)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Timeouts - fail fast and try next server
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Route: http://localhost/auth/login -> auth-service/login
        location /auth/ {
            rewrite ^/auth/(.*) /$1 break;
            proxy_pass http://auth-service;
        }

        # Route: http://localhost/shopping/* -> shopping-service/*
        location /shopping/ {
            rewrite ^/shopping/(.*) /$1 break;
            proxy_pass http://shopping-service;
        }

        # Route: http://localhost/personalization/* -> personalization-service/*
        location /personalization/ {
            rewrite ^/personalization/(.*) /$1 break;
            proxy_pass http://personalization-service;
        }
    }
}