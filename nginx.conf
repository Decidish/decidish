events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream auth-service {
        server authorization-server:8083;
    }

    upstream shopping-service {
        server core-server:8080;
    }

    upstream personalization-service {
        server personalization-server:8082;
    }

    upstream mlpipeline-service {
        server mlpipeline:8000;
    }

    server {
        listen 80;

        # Shared Proxy Settings (applied to all locations below)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Route: http://localhost/auth/login -> auth-service/login
        location /auth/ {
            rewrite ^/auth/(.*) /$1 break;
            
            proxy_pass http://auth-service;
        }

        # Route: http://localhost/users/profile -> user-service/profile
        location /shopping/ {
            rewrite ^/shopping/(.*) /$1 break;
            proxy_pass http://shopping-service;
        }

        # Route: http://localhost/payments/pay -> payment-service/pay
        location /personalization/ {
            rewrite ^/personalization/(.*) /$1 break;
            proxy_pass http://personalization-service;
        }

        location /mlpipeline/ {
            rewrite ^/mlpipeline/(.*) /$1 break;
            proxy_pass http://mlpipeline-service;
        }
    }
}