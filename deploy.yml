  # # MLPipeline
  # mlpipeline:
  #   image: decidish/mlpipeline-service:latest
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./mlpipeline:/app
  #   environment:
  #     - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_backend:5432/${POSTGRES_DB}
  #   depends_on:
