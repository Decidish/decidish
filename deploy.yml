  #     - MINIO_RECIPES_BUCKET=${MINIO_RECIPES_BUCKET}
  #     - MINIO_RECIPES_OBJECT=${MINIO_RECIPES_OBJECT}
  #   depends_on:
  #     - db_backend
  #     - rabbitmq
  #   deploy:
  #     mode: replicated
  #     replicas: 3
  #     endpoint_mode: vip
  #     restart_policy:
  #       condition: on-failure
