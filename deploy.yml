services:
  # ----------------------------------------------------------------
  # Databases & Cache
  # ----------------------------------------------------------------

  migrator:
    image: decidish/migrator:${IMAGE_TAG:-latest}
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db_backend
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - app-network

  # PostgreSQL with pgvector
  db_backend:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_backend_data:/var/lib/postgresql/data
      # Note: This path must exist on the node running this service
      - ./init_db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  db_authorisation:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_authorisation_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Application Services
  # ----------------------------------------------------------------

  # Authorization Server
  authorization-server:
    image: decidish/authorization-service:${IMAGE_TAG:-latest}
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      restart_policy:
        condition: any

  # Core Server
  core-server:
    image: decidish/core-service:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_backend:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
      - SHOPPING_API_FALLBACK_ENABLED=${SHOPPING_API_FALLBACK_ENABLED:-true}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3
      restart_policy:
        condition: any

  # Personalization Server
  personalization-server:
    image: decidish/personalization-service:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=db_backend
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_BACKEND_URL}
      - EMBEDDER_SERVER_URL=http://mlpipeline:8000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      restart_policy:
        condition: any

  # MLPipeline
  mlpipeline:
    image: decidish/mlpipeline-service:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db_backend
      - POSTGRES_PORT=5432
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - DATABASE_BACKEND_CONNECTION_STRING=${DATABASE_BACKEND_CONNECTION_STRING}
      - ADAPTER_CKPT_DIR=/app/models/adapter_checkpoints
    volumes:
      - ./ckpts_weekly_user_adapter:/app/models/adapter_checkpoints
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
    

  client-web:
    image: decidish/client-web:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  olivetin:
    image: ghcr.io/olivetin/olivetin:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cron-scripts:/scripts:ro
    configs:
      - source: olivetin_config
        target: /config/config.yaml
    ports:
      - "8099:1337"
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  # ----------------------------------------------------------------
  # Reverse Proxy
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # ----------------------------------------------------------------
  # Monitoring
  # ----------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3031:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-secret}
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_config
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana_dashboard_decidish
        target: /etc/grafana/provisioning/dashboards/grafana-dashboard-decidish.json
      - source: grafana_dashboard_scalability
        target: /etc/grafana/provisioning/dashboards/grafana-dashboard-scalability.json
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

# ----------------------------------------------------------------
# Configs
# ----------------------------------------------------------------
configs:
  olivetin_config:
    file: ./olivetin-config.yml
  nginx_config:
    file: ./nginx.conf
  prometheus_config:
    file: ./prometheus.yml
  grafana_datasources:
    file: ./datasources.yml
  grafana_dashboards_config:
    file: ./grafana-provisioning-dashboards.yaml
  grafana_dashboard_decidish:
    file: ./grafana-dashboard-decidish-v2.json
  grafana_dashboard_scalability:
    file: ./grafana-dashboard-scalability.json

# ----------------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------------
volumes:
  db_backend_data:
  db_authorisation_data:
  prometheus_data:

networks:
  app-network:
    driver: overlay
    attachable: true