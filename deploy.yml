  client-web:
    image: decidish/client-web:latest
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------
  # Messaging Services
  # ----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      # Credentials for the default user
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      # AMQP port
      - "5672:5672"
      # Management UI port
      - "15672:15672"
    volumes:
      # Persistent storage for message data and configurations
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    networks:
      - app-network

# ----------------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------------
volumes:
  db_backend_data:
  db_authorisation_data:
  kafka_data:
  rabbitmq_data:

networks:
  app-network:
    driver: overlay