version: '3.8'

services:
  # ----------------------------------------------------------------
  # Databases & Cache
  # ----------------------------------------------------------------

  migrator:
    # Swarm cannot build. You must build this image: "docker build -t my-registry/migrator ./migrations"
    image: decidish/migrator:${IMAGE_TAG}
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db_backend
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - app-network

  # PostgreSQL with pgvector
  db_backend:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_backend_data:/var/lib/postgresql/data
      # Note: This path must exist on the node running this service
      - ./init_db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  db_authorisation:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_authorisation_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  # ----------------------------------------------------------------
  # Application Services
  # ----------------------------------------------------------------

  # Authorization Server
  authorization-server:
    # Build: "docker build -t my-registry/authorization-server ./backend/authorization"
    image: decidish/authorization-service:${IMAGE_TAG}
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Core Server
  core-server:
    # Build: "docker build -t my-registry/core-server ./backend/core"
    image: decidish/authorization-service:${IMAGE_TAG}
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_backend:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    networks:
      - app-network

  # Personalization Server
  personalization-server:
    # Build: "docker build -t my-registry/personalization-server ./backend/personalization"
    image: decidish/personalization-service:${IMAGE_TAG}
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=db_backend
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_BACKEND_URL}
      - EMBEDDER_SERVER_URL=${EMBEDDER_SERVER_URL}
    networks:
      - app-network

  # MLPipeline
  mlpipeline:
    # Build: "docker build -t my-registry/mlpipeline ./mlpipeline"
    image: decidish/mlpipeline-service:${IMAGE_TAG}
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db_backend
      - POSTGRES_PORT=5432
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - DATABASE_BACKEND_CONNECTION_STRING=${DATABASE_BACKEND_CONNECTION_STRING}
    networks:
      - app-network

  client-web:
    # Build: "docker build --build-arg VITE_BASE_URL=${VITE_BASE_URL} -t my-registry/client-web ./client"
    image: decidish/client-web:${IMAGE_TAG}
    ports:
      - "3000:3000"
    networks:
      - app-network
    deploy:
      replicas: 1
      update_config:
        order: start-first
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 10s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------
  # Reverse Proxy
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Note: nginx.conf must exist on the node running this task
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    deploy:
      mode: global  # Runs one instance on every node (common for ingress)
      # OR use 'replicas: 1' if you only want it on one node

  # ----------------------------------------------------------------
  # Monitoring
  # ----------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3031:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=secret
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - app-network

# ----------------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------------
volumes:
  db_backend_data:
  db_authorisation_data:
  prometheus_data:

networks:
  app-network:
    driver: overlay
    attachable: true