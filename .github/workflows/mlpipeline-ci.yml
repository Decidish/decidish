name: ML Pipeline CI (uv)

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string

env:
  SERVICE_DIR: mlpipeline
  IMAGE_NAME: decidish/mlpipeline-service
  PYTHON_VERSION: '3.13'

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ env.SERVICE_DIR }}/uv.lock"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. Install dependencies & Test
      - name: Build and Test
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          uv sync --frozen
          uv run pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/main'
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.environment || 'latest' }}