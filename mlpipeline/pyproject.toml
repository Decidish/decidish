[tool.poetry]
name = "mlpipeline"
version = "0.1.0"
description = ""
authors = ["sarpsahinalp <sarp.sahinalp@tum.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
psycopg2-binary = "^2.9.9" # Required for Postgres connection
asyncpg = "^0.31.0"
pgvector = "^0.4.2"
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
sklearn-crfsuite = "^0.5.0"
spacy = "^3.8.11"
recipe-scrapers = "^15.11.0"
selenium = "^4.39.0"
webdriver-manager = "^4.0.2"
minio = "^7.2.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"