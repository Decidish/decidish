[tool.poetry]
name = "mlpipeline"
version = "0.1.0"
description = ""
authors = ["sarpsahinalp <sarp.sahinalp@tum.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
psycopg2-binary = "^2.9.9" # Required for Postgres connection
asyncpg = "^0.31.0"
pgvector = "0.4.2"
pytest = "^9.0.2"
sklearn-crfsuite = "^0.5.0"
email-validator = "2.3.0"
fastapi-cli = "0.0.20"
fastapi-cloud-cli = "0.8.0"
httpx = "0.28.1"
numpy = "2.3.5"
pandas = "2.3.3"
pillow = "11.3.0"
python-dotenv = "1.2.1"
python-multipart = "0.0.21"
pyyaml = "6.0.3"
rich = "14.2.0"
scikit-learn = "1.7.2"
scipy = "1.16.3"
sentence-transformers = "5.1.2"
sentry-sdk = "2.48.0"
transformers = "4.57.3"
typer = "0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"