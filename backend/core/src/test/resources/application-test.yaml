MINIO_ENDPOINT: http://localhost:9000
MINIO_ACCESS_KEY: test-access-key
MINIO_SECRET_KEY: test-secret-key

spring:
  cache:
    type: redis
    redis:
      time-to-live: 60m 
      cache-null-values: false
      key-prefix: "decidish:"
      use-key-prefix: true

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://localhost:5433/decidish
    username: user
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true 
    properties:
      hibernate:
        generate_statistics: false
        use_sql_comments: false
        format_sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql: TRACE

  sql:
    init:
      mode: never

  session:
    store-type: none

  application:
    name: "core"

  flyway:
    enabled: "true"
    baseline-on-migrate: "true"
    validate-on-migrate: "false"
    baseline-version: 0
    locations: classpath:db/migration

  # --- SSL FALLBACK CONFIGURATION ---
  # This is used by ApiClientConfig.java ONLY if MinIO connection fails.
  ssl:
    bundle:
      pem:
        rewe-client:
          keystore:
            # Point these to your local certificate files
            certificate: "classpath:certificates/rewe.pem"
            private-key: "classpath:certificates/rewe.key"

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    decidish.com: INFO
    com.zaxxer: ERROR
    org.hibernate: OFF
    org.hibernate.type.descriptor.sql: OFF